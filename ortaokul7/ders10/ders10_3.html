<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7. Sınıf Ders 10.3: Görsel Rehber | Hazırlanıyoruz 🎨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #F59E0B;
            --primary-glow: #FDE047;
            --bg-grad: linear-gradient(135deg, #0B0F19 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #F8FAFC;
            --text-muted: #CBD5E1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: var(--bg-grad);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(20px);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 158, 11, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary-glow);
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.92rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .icon {
            font-size: 4rem;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #FFF;
            background: linear-gradient(90deg, #FDE047, #F59E0B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.25;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🎨 10.3 GÖRSEL REHBER</div>
        <div class="icon">🖼️</div>
        <h1>10.3 Görsel Rehber Hazırlanıyor!</h1>
        <p>
            7. Sınıf 10.3 Hikâye Haritası, Karakter Storyboard Kartları ve Senaryo İstemleri Görsel Rehberi yeni dönem müfredatı için hazırlanmaktadır.<br>
            Çok yakında canlı video ve prompt vitriniyle burada buluşacağız!
        </p>
    </div>
</body>
</html>
