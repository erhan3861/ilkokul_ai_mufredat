<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sürükle Bırak — Şekilleri Kutusuna Taşı</title>
<meta name="description" content="1. ve 2. sınıflar için Three.js ile hazırlanmış 3B Sürükle Bırak oyunu: şekilleri tut, taşı ve doğru kutuya bırak.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage-kapsayici" id="stageKapsayici">
<div class="tutorial-stage" id="stage">

  <div class="gokyuzu" aria-hidden="true">
    <div class="gunes"></div>
    <div class="bulut bulut1"></div>
    <div class="bulut bulut2"></div>
  </div>

  <main class="sayfa">

    <header class="ust">
      <div class="baslik-kutu">
        <h1>🖱️ Sürükle Bırak</h1>
        <p class="alt-baslik">İlkokul • Mouse Becerileri • <b>Adım 3</b></p>
      </div>
      <div class="skor-kutu" id="skorKutu" title="Yıldızların">
        <span class="skor-emoji">⭐</span>
        <span class="skor-sayi" id="skorSayi">0</span>
      </div>
    </header>

    <section class="adimlar" aria-label="Nasıl oynanır">
      <div class="adim"><span class="adim-emoji">👆</span><span class="adim-yazi">1. Şekle <b>bas ve tut</b></span></div>
      <div class="adim"><span class="adim-emoji">➡️</span><span class="adim-yazi">2. Kutusuna <b>taşı</b></span></div>
      <div class="adim"><span class="adim-emoji">🎁</span><span class="adim-yazi">3. Orada <b>bırak</b></span></div>
      <button class="btn-dinle" id="btnDinle" type="button">🔊 Dinle</button>
    </section>

    <section class="sahne-kutu">
      <div id="sahne" class="sahne" role="application" aria-label="Şekilleri tutup doğru kutuya taşı."></div>

      <div class="hud" id="hud">
        <span class="hud-yazi">Kalan şekil</span>
        <span class="hud-sayi" id="kalanSayi">6</span>
      </div>

      <div class="tur" id="turKutu">Tur <b id="turSayi">1</b></div>

      <div class="balon" id="balon">Şekli tut ve kutusuna taşı! 🎁</div>

      <div class="hata" id="hata" hidden>
        <h2>😢 3B motoru yüklenemedi</h2>
        <p>Bu oyun için <b>internet bağlantısı</b> gerekiyor. Bağlantını kontrol edip sayfayı yenile.</p>
      </div>

      <div class="konfeti" id="konfeti" aria-hidden="true"></div>
    </section>

    <section class="kontroller" aria-label="Oyun düğmeleri">
      <button class="btn buyuk mor" id="btnMod" type="button">
        <span class="btn-emoji" id="modEmoji">🎨</span>
        <span class="btn-yazi">Eşleştir<small id="modAd">Renkleri</small></span>
      </button>
      <button class="btn buyuk pembe" id="btnZorluk" type="button">
        <span class="btn-emoji" id="zorlukEmoji">🎈</span>
        <span class="btn-yazi">Zorluk<small id="zorlukAd">Kolay</small></span>
      </button>
      <button class="btn buyuk turkuaz" id="btnYeni" type="button">
        <span class="btn-emoji">🔁</span>
        <span class="btn-yazi">Yeni Tur<small>Baştan</small></span>
      </button>
      <button class="btn buyuk sari" id="btnYardim" type="button">
        <span class="btn-emoji">💡</span>
        <span class="btn-yazi">İpucu<small>Göster</small></span>
      </button>
      <button class="btn buyuk yesil" id="btnFoto" type="button">
        <span class="btn-emoji">📸</span>
        <span class="btn-yazi">Fotoğraf<small>Kaydet</small></span>
      </button>
    </section>

    <section class="kontroller kucuk-satir">
      <button class="btn kucuk" id="btnSes" type="button"><span class="btn-emoji">🔊</span><span class="btn-yazi">Ses Açık</span></button>
    </section>

  </main>

</div>
</div>

<!-- ===== Sahne ölçekleme ===== -->
<script>
(function () {
  var SAHNE_G = 1280, SAHNE_Y = 800;
  var stage = document.getElementById('stage');
  function olcekle() {
    var vg = window.innerWidth, vy = window.innerHeight;
    if (window.visualViewport) { vg = window.visualViewport.width; vy = window.visualViewport.height; }
    var o = Math.min(vg / SAHNE_G, vy / SAHNE_Y);
    stage.style.transform = 'translate(' + ((vg - SAHNE_G * o) / 2) + 'px,' + ((vy - SAHNE_Y * o) / 2) + 'px) scale(' + o + ')';
    window.__sahneOlcek = o;
    if (window.__olcekDegisti) window.__olcekDegisti(o);
  }
  window.addEventListener('resize', olcekle);
  window.addEventListener('orientationchange', olcekle);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', olcekle);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(olcekle).catch(function () { }); }
  window.addEventListener('load', olcekle);
  olcekle();
})();
</script>

<!-- ===== Three.js yükleyici ===== -->
<script>
(function () {
  var kaynaklar = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  var i = 0, oyunYuklendi = false;
  function hataGoster() {
    if (typeof THREE !== 'undefined') return;
    var g = document.getElementById('hata');
    if (g) g.hidden = false;
  }
  function oyunuYukle() {
    if (oyunYuklendi) return;
    oyunYuklendi = true;
    var o = document.createElement('script');
    o.src = 'script.js';
    o.onerror = hataGoster;
    document.body.appendChild(o);
  }
  function sonraki() {
    if (typeof THREE !== 'undefined') { oyunuYukle(); return; }
    if (i >= kaynaklar.length) { hataGoster(); return; }
    var s = document.createElement('script');
    s.src = kaynaklar[i++];
    s.onload = oyunuYukle;
    s.onerror = sonraki;
    document.head.appendChild(s);
  }
  sonraki();
})();
</script>

</body>
</html>
