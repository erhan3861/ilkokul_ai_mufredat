html, body { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
body {

.rozet.ai  { background: var(--ai-bg);  color: var(--ai-koyu);  border: 2px solid #DCC4FA; }

.sayfa-sec { display: flex; align-items: center; gap: 7px; }

  0%, 100% { box-shadow: 0 8px 20px rgba(29,53,87,.14); }

.bosluk {

/* ---------- Alt şerit ---------- */
.alt {

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

var DERSLER = [

(function () {

    var vg = window.innerWidth, vy = window.innerHeight;

    var o = Math.min(vg / G, vy / Y);
    stage.style.transform = 'translate(' + ((vg - G * o) / 2) + 'px,' + ((vy - Y * o) / 2) + 'px) scale(' + o + ')';
  }
  window.addEventListener('resize', olcekle);
  window.addEventListener('orientationchange', olcekle);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', olcekle);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(olcekle).catch(function () { });
  window.addEventListener('load', olcekle);
  olcekle();
})();

  var btnGeri = document.getElementById('geri');
  var btnIleri = document.getElementById('ileri');

  var liste = HAFTALAR.slice(), sayfa = 0, parlayan = 0, seciliHafta = 1;
  haftaGirdi.max = TOPLAM_HAFTA;

  function normal(s) {
    return (s || '').toLocaleLowerCase('tr')
      .replace(/ı/g, 'i').replace(/İ/g, 'i').replace(/ş/g, 's')
      .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c');
  }

  function metni(h) {
    return [h.no, h.kod ? h.kod.ad : '', h.kod ? h.kod.hedef : '',
            h.ai.ad, h.ai.dersAd, 'ders ' + h.ai.ders, 'hafta ' + h.no].join(' ');
  }

  function filtrele() {
    var q = normal(araGirdi.value.trim());
    araTemizle.hidden = (q === '');
    liste = HAFTALAR.filter(function (h) { return !q || normal(metni(h)).indexOf(q) >= 0; });
    sayfa = 0;
    ciz();
  }

  function sayfaSayisi() { return Math.max(1, Math.ceil(liste.length / SAYFADA)); }

  function panelKod(h) {
    if (!h.kod) {
      return '<div class="panel kod bos">' +
        '<span class="tur">🧩 BLOK KODLAMA</span>' +
        '<h3>Tekrar & Proje</h3>' +
        '<p class="hedef">18 adım tamamlandı. Bu haftalarda öğrenciler sevdikleri oyunu tekrar oynar ya da proje yapar.</p>' +
        '<div class="dugmeler"><a class="ac" href="#">—</a></div></div>';
    }
    var link = KOD_LINK[h.kod.no], rehber = KOD_REHBER[h.kod.no];
    var onz = ONIZLEME.kod[h.kod.no];
    return '<div class="panel kod' + (link ? '' : ' bos') + '">' +
      '<span class="tur">🧩 BLOK KODLAMA • ADIM ' + h.kod.no + '</span>' +
      '<div class="ic">' +
        (onz ? '<img class="onizleme" src="' + onz + '" alt="Oyundan görüntü" loading="lazy">' : '') +
        '<div class="metin">' +
          '<h3>' + h.kod.emoji + ' ' + h.kod.ad + '</h3>' +
          '<p class="hedef">🎯 ' + h.kod.hedef + '</p>' +
        '</div></div>' +
      '<div class="dugmeler">' +
        (link ? '<a class="ac" href="' + link + '">▶ Aç</a>' : '<a class="ac" href="#">⏳ Yakında</a>') +
        (rehber ? '<a class="rehber-buyuk kod" href="' + rehber + '">👩‍🏫 Rehber</a>' : '') +
      '</div></div>';
  }

  function panelAi(h) {
    var a = h.ai;
    var onzA = ONIZLEME.ai[h.no];
    return '<div class="panel ai">' +
      '<span class="tur">🚀 AI-GALAXY • D' + a.ders + ' · ADIM ' + a.adim + '</span>' +
      '<div class="ic">' +
        (onzA ? '<img class="onizleme" src="' + onzA + '" alt="Etkinlikten görüntü" loading="lazy">' : '') +
        '<div class="metin">' +
          '<h3>' + a.emoji + ' ' + a.ad + '</h3>' +
          '<p class="hedef">📘 ' + a.dersAd + '</p>' +
        '</div></div>' +
      '<div class="dugmeler">' +
        '<a class="ac" href="' + a.link + '" target="_blank" rel="noopener">▶ Aç</a>' +
        '<a class="rehber-buyuk" href="./ai_rehber.html?ders=' + a.ders + '&adim=' + a.adim + '&hafta=' + h.no + '">👩‍🏫 Rehber</a>' +
      '</div></div>';
  }

  function ciz() {
    izgara.innerHTML = '';
    if (!liste.length) {
      izgara.innerHTML = '<div class="bosluk"><span>🔎</span>Aramana uyan hafta bulunamadı.</div>';
      sayfaNo.textContent = '0 / 0';
      btnGeri.disabled = btnIleri.disabled = true;
      return;
    }
    var bas = sayfa * SAYFADA, dilim = liste.slice(bas, bas + SAYFADA);

    dilim.forEach(function (h) {
      var k = document.createElement('article');
      k.className = 'hafta-kart' + (h.no === seciliHafta ? ' secili' : '');
      k.dataset.no = h.no;
      k.innerHTML =
        '<div class="hafta-no"><small>HAFTA</small><b>' + h.no + '</b></div>' +
        panelKod(h) + panelAi(h);
      k.addEventListener('click', function (ev) {
        if (ev.target.closest('a')) return;      /* düğmeye basıldıysa karışma */
        seciliHafta = h.no;
        haftaGirdi.value = h.no;
        ciz();
      });
      izgara.appendChild(k);

      if (parlayan === h.no) {
        k.classList.add('parla');
        setTimeout(function () { k.classList.remove('parla'); }, 1700);
        parlayan = 0;
      }
    });
    for (var i = dilim.length; i < SAYFADA; i++) izgara.appendChild(document.createElement('div'));

    sayfaNo.textContent = (sayfa + 1) + ' / ' + sayfaSayisi();
    btnGeri.disabled = (sayfa === 0);
    btnIleri.disabled = (sayfa >= sayfaSayisi() - 1);
  }

  function haftayaGit(no) {
    no = Math.max(1, Math.min(TOPLAM_HAFTA, parseInt(no, 10) || 1));
    haftaGirdi.value = no;
    araGirdi.value = ''; araTemizle.hidden = true;
    liste = HAFTALAR.slice();
    sayfa = Math.floor((no - 1) / SAYFADA);
    parlayan = no;
    seciliHafta = no;
    ciz();
  }

  araGirdi.addEventListener('input', filtrele);
  araTemizle.addEventListener('click', function () { araGirdi.value = ''; filtrele(); araGirdi.focus(); });
  haftaGirdi.addEventListener('change', function () { haftayaGit(haftaGirdi.value); });
  haftaGirdi.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); haftayaGit(haftaGirdi.value); haftaGirdi.blur(); }
  });
  document.getElementById('haftaYukari').addEventListener('click', function () { haftayaGit((parseInt(haftaGirdi.value, 10) || 0) + 1); });
  document.getElementById('haftaAsagi').addEventListener('click', function () { haftayaGit((parseInt(haftaGirdi.value, 10) || 2) - 1); });
  btnGeri.addEventListener('click', function () { if (sayfa > 0) { sayfa--; ciz(); } });
  btnIleri.addEventListener('click', function () { if (sayfa < sayfaSayisi() - 1) { sayfa++; ciz(); } });

  window.addEventListener('keydown', function (e) {
    var yaziyor = (document.activeElement === araGirdi || document.activeElement === haftaGirdi);
    if (yaziyor) return;
    if (e.key === 'ArrowLeft') btnGeri.click();
    if (e.key === 'ArrowRight') btnIleri.click();
    if (e.key === 'ArrowUp') { e.preventDefault(); haftayaGit((parseInt(haftaGirdi.value, 10) || 0) + 1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); haftayaGit((parseInt(haftaGirdi.value, 10) || 2) - 1); }
  });

  ciz();
})();
</script>

</body>
</html>
